<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 11. Ready -->
    <!-- 11.1 Ready text -->
    <section
      class="flex flex-col items-center justify-center text-center pt-10 px-4 lg:py-20 lg:px-35"
    >
      <!-- 9.1 What text -->
      <div class="mb-6 lg:mb-16">
        <h2 class="font-bold text-[28px] lg:text-[40px] mb-2.5">
          Ready to Start? Let's Talk.
        </h2>
        <p
          class="font-medium text-[14px] lg:text-[18px] mb-4.5 dark:text-[#A4A7AE]"
        >
          Tell us what you need, and we'll get back to you soon.
        </p>
      </div>
      <!-- 9.2 Ready form-->
      <div class="w-full max-w-[720px] mx-auto">
        <form class="space-y-5">
          <!-- Name -->
          <div class="mx-w-[720px]">
            <label class="text-left block font-semibold mb-1">Name</label>
            <input
              type="text"
              placeholder="Enter your name"
              class="w-full border dark:border-[#252B37] border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400"
            />
          </div>

          <!-- Email -->
          <div>
            <label class="text-left block font-semibold mb-1">Email</label>
            <input
              type="email"
              placeholder="Enter your email"
              class="w-full border dark:border-[#252B37] border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400"
            />
          </div>

          <!-- Message -->
          <div>
            <label class="text-left block font-semibold mb-1">Message</label>
            <textarea
              rows="4"
              placeholder="Enter your message"
              class="w-full border dark:border-[#252B37] border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400"
            ></textarea>
          </div>

          <!-- Services -->
          <div>
            <label class="text-left block font-semibold mb-2">Services</label>
            <div
              class="grid grid-cols-1 lg:grid-cols-2 gap-x-4 gap-y-2 text-sm"
            >
              <label class="flex items-center space-x-2">
                <input
                  type="checkbox"
                  class="accent-orange-500 rounded dark:accent-[#252B37]"
                />
                <span>Web Development</span>
              </label>
              <label class="flex items-center space-x-2">
                <input
                  type="checkbox"
                  class="accent-orange-500 rounded dark:accent-[#252B37]"
                />
                <span>Cloud Solutions</span>
              </label>
              <label class="flex items-center space-x-2">
                <input
                  type="checkbox"
                  class="accent-orange-500 rounded dark:accent-[#252B37]"
                />
                <span>Mobile App Development</span>
              </label>
              <label class="flex items-center space-x-2">
                <input
                  type="checkbox"
                  class="accent-orange-500 rounded dark:accent-[#252B37]"
                />
                <span>Software Development</span>
              </label>
              <label class="flex items-center space-x-2">
                <input
                  type="checkbox"
                  class="accent-orange-500 rounded dark:accent-[#252B37]"
                />
                <span>UI/UX Design</span>
              </label>
              <label class="flex items-center space-x-2">
                <input
                  type="checkbox"
                  class="accent-orange-500 rounded dark:accent-[#252B37]"
                />
                <span>Other</span>
              </label>
            </div>
          </div>

          <!-- Send Button -->
          <div>
            <button
              type="submit"
              class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 rounded-full"
            >
              Send
            </button>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
