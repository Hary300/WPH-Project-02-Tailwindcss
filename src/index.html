<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge 2 - Hary300</title>
    <link
      rel="shortcut icon"
      href="../public/icons/landing-page.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/output.css" />
    <script src="./script.js" defer></script>
  </head>

  <body
    class="dark:text-white dark:bg-black relative flex flex-col font-quicksand"
  >
    <!-- 1. Header -->
    <header
      class="flex justify-between sticky w-full h-16 top-0 p-4 backdrop-blur-xl lg:max-w-[1400px] lg:px-[80px] xl:px-[140px] m-auto"
    >
      <!-- 1.1 Logo -->
      <div class="flex items-center gap-3">
        <img src="./assets/img/light/logo-symbol.svg" alt="Logo" />
        <h1 class="font-outfit font-semibold text-2xl">Your Logo</h1>
      </div>

      <!-- 1.4 Nav menu (Desktop) -->
      <nav class="dark:bg-black gap-4 hidden lg:flex items-center">
        <!-- 1.4 Nav menu -->
        <ul
          class="flex justify-center items-center lg:gap-8 font-semibold text-4 w-full dark:text-[#FDFDFD] text-black"
        >
          <li><a href="#">About</a></li>
          <li><a href="#">Service</a></li>
          <li><a href="#">Projects</a></li>
          <li><a href="#">Testimonials</a></li>
          <li><a href="#">FAQ</a></li>
        </ul>
      </nav>

      <!-- 1.2 dark mode button, hamburger button (mobile) and lets talk button (desktop)-->

      <div class="buttons flex items-center gap-2">
        <!-- dark mode button -->
        <button
          class="dark-button flex justify-center items-center p-0.5 rounded-lg border-2 cursor-pointer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="size-4.5"
          >
            <path
              fill-rule="evenodd"
              d="M7.455 2.004a.75.75 0 0 1 .26.77 7 7 0 0 0 9.958 7.967.75.75 0 0 1 1.067.853A8.5 8.5 0 1 1 6.647 1.921a.75.75 0 0 1 .808.083Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>

        <!-- hamburger button (mobile) -->
        <button
          class="hamburger-button relative lg:hidden z-50 flex flex-col items-center justify-center gap-1.5"
        >
          <span class="ham-btn-span"></span>
          <span class="ham-btn-span"></span>
          <span class="ham-btn-span"></span>
        </button>

        <!--  let's talk button (desktop) -->
        <div class="button-container dark:bg-black hidden lg:flex">
          <button
            class="text-sm font-bold text-white bg-[#FF623E] rounded-full py-2 px-8"
          >
            Let's Talk
          </button>
        </div>
      </div>
    </header>

    <!-- 1.3 offset menu (mobile) -->
    <nav
      class="offset-menu fixed top-16 left-0 px-4 mobile-menu w-full bg-white dark:bg-black h-screen flex flex-col gap-4 lg:hidden"
    >
      <!-- 1.3.1 Nav menu -->
      <ul
        class="flex flex-col justify-center gap-4 font-semibold text-4 w-full dark:text-[#FDFDFD] text-black"
      >
        <li><a href="#">About</a></li>
        <li><a href="#">Service</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Testimonials</a></li>
        <li><a href="#">FAQ</a></li>
      </ul>

      <!-- 1.3.2 Let's talk button -->
      <div class="button-container w-full dark:bg-black">
        <button class="btn">Let's Talk</button>
      </div>
    </nav>

    <!-- end -->

    <div
      class="container md:max-w-[1400px] h-[2000px] flex flex-col items-center pb-4 m-auto"
    >
      <!-- 13. Footer -->
      <footer>
        &copy 2026 Created By
        <a
          href="https://github.com/Hary300"
          target="_blank"
          class="text-amber-500 hover:text-amber-200 hover:underline"
          >Hary300</a
        >
      </footer>
    </div>
  </body>
</html>
