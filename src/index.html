<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge 2 - Hary300</title>
    <link
      rel="shortcut icon"
      href="../public/icons/landing-page.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/output.css" />
    <script src="./script.js" defer></script>
  </head>

  <body
    class="dark:text-white dark:bg-black relative flex flex-col font-quicksand"
  >
    <!-- 1. Header -->
    <header
      id="header"
      class="container w-full flex justify-between sticky h-16 top-0 p-4 backdrop-blur-xl z-10 md:px-[30px] lg:px-[80px] xl:px-[140px] m-auto"
    >
      <!-- 1.1 Logo -->
      <div class="flex items-center gap-3">
        <img src="./assets/img/light/logo-symbol.svg" alt="Logo" />
        <h1 class="font-outfit font-semibold text-2xl">Your Logo</h1>
      </div>

      <!-- 1.2 Nav menu (Desktop) -->
      <nav class="dark:bg-black gap-4 hidden lg:flex items-center">
        <!-- 1.2.1 Nav link menu -->
        <ul
          class="flex justify-center items-center lg:gap-8 font-semibold text-4 w-full dark:text-[#FDFDFD] text-black"
        >
          <li><a href="#">About</a></li>
          <li><a href="#">Service</a></li>
          <li><a href="#">Projects</a></li>
          <li><a href="#">Testimonials</a></li>
          <li><a href="#">FAQ</a></li>
        </ul>
      </nav>

      <!-- 1.3 dark mode button, hamburger button (mobile) and lets talk button (desktop)-->
      <div class="buttons flex items-center gap-2 lg:w-[15%]">
        <!-- 1.3.1 dark mode button -->
        <button
          class="dark-button flex justify-center items-center p-0.5 rounded-lg border-2 cursor-pointer"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="size-4.5"
          >
            <path
              fill-rule="evenodd"
              d="M7.455 2.004a.75.75 0 0 1 .26.77 7 7 0 0 0 9.958 7.967.75.75 0 0 1 1.067.853A8.5 8.5 0 1 1 6.647 1.921a.75.75 0 0 1 .808.083Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>

        <!-- 1.3.2 hamburger button (mobile) -->
        <button
          class="hamburger-button relative lg:hidden z-50 flex flex-col items-center justify-center gap-1.5"
        >
          <span class="ham-btn-span"></span>
          <span class="ham-btn-span"></span>
          <span class="ham-btn-span"></span>
        </button>

        <!--  1.3.3. let's talk button (desktop) -->
        <div class="button-container dark:bg-black hidden lg:flex w-full">
          <button class="btn">Let's Talk</button>
        </div>
      </div>
    </header>

    <!-- 1.4 offset menu (mobile) -->
    <nav
      class="offset-menu fixed top-16 left-0 px-4 mobile-menu w-full bg-white z-10 dark:bg-black h-screen flex flex-col gap-4 lg:hidden"
    >
      <!-- 1.3.1 Nav menu -->
      <ul
        class="flex flex-col justify-center gap-4 font-semibold text-4 w-full dark:text-[#FDFDFD] text-black"
      >
        <li><a href="#">About</a></li>
        <li><a href="#">Service</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Testimonials</a></li>
        <li><a href="#">FAQ</a></li>
      </ul>

      <!-- 1.3.2 Let's talk button -->
      <div class="button-container w-full dark:bg-black">
        <button class="btn">Let's Talk</button>
      </div>
    </nav>

    <!-- 2. Hero Section -->
    <section
      id="hero"
      class="container flex flex-col lg:flex lg:flex-row lg:relative items-center pt-5 lg:py-15 xl:py-52 md:px-[30px] lg:px-[80px] xl:px-[140px] m-auto w-full"
    >
      <!-- 2.1 Hero text -->
      <div
        class="flex flex-col gap-5 w-full px-4 md:px-0 lg:w-[50%] xl:w-[55%]"
      >
        <h1 class="font-bold text-4xl xl:text-5xl lg:leading-14 xl:leading-16">
          Your Tech Partner for
          <span class="text-[#FF6C37]">Smarter Growth</span>
        </h1>
        <p class="text-base font-semibold xl:text-lg">
          We deliver tailored IT solutions to help you scale with speed and
          confidence.
        </p>

        <!-- 2.2 Hero button -->
        <button class="btn lg:text-base mt-5 mb-10 lg:max-w-[200px]">
          Let's Talk
        </button>
      </div>

      <!-- 2.3 Hero Image -->
      <div
        class="lg:absolute lg:-z-1 lg:right-0 lg:-top-10 w-full lg:w-[50%] xl:w-[60%]"
      >
        <div class="relative">
          <!-- Logo untuk Light Mode -->
          <img
            src="./assets/img/light/Image Hero.svg"
            alt="lighting"
            class="w-full h-auto block dark:hidden"
          />
          <!-- Logo untuk dark Mode -->
          <img
            src="./assets/img/dark/Image Hero (1).svg"
            alt="darking"
            class="w-full h-auto hidden dark:block"
          />
          <!-- gradient -->
          <div
            class="absolute top-0 w-full h-25 lg:hidden bg-linear-to-b dark:from-black from-white to-transparent z-5"
          ></div>
        </div>
      </div>
    </section>

    <main
      class="container h-[2000px] flex flex-col items-center px-4 pb-4 m-auto"
    >
      <!-- END OF HERO SECTION -->
      <!-- 13. Footer -->
    </main>
    <footer class="m-auto p-3">
      &copy 2026 Created By
      <a
        href="https://github.com/Hary300"
        target="_blank"
        class="text-amber-500 hover:text-amber-200 hover:underline"
        >Hary300</a
      >
    </footer>
  </body>
</html>
