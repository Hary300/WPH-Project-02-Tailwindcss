<!doctype html>
<html lang="en" class="">

    <title>Challenge 2 - Hary300</title>
    <link

      href="../public/icons/landing-page.png"

    />
    <link rel="stylesheet" href="./css/output.css" />
    <script src="./script.js" defer></script>
  </head>

  <body
    class="dark:text-white dark:bg-black relative flex flex-col font-quicksand"
  >
    <!-- 1. Header -->
    <header
      class="flex justify-between sticky w-full h-16 top-0 p-4 backdrop-blur-xl"
    >
      <!-- 1.1 Logo -->
      <div class="flex items-center gap-3">
        <img src="./assets/img/light/logo-symbol.svg" alt="Logo" />
        <h1 class="font-outfit font-semibold text-2xl">Your Logo</h1>
      </div>

      <nav class="fixed top-16 left-0 mobile-menu w-full bg-amber-200 h-screen">

        <div class="px-4">
          <ul
            class="flex flex-col justify-center gap-4 font-semibold text-4 w-full dark:text-[#FDFDFD] text-black"

            <li><a href="#">About</a></li>
            <li><a href="#">Service</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Testimonials</a></li>
            <li><a href="#">FAQ</a></li>
          </ul>
        </div>
      </nav>

      <!-- 1.2 Let's talk button -->
      <div
        class="button-container left-0 fixed top-65 px-4 py-2 w-full bg-white dark:bg-black mobile-menu"
      >
        <button class="btn">Let's Talk</button>
      </div>

      <!-- 1.3 hamburger icon-->
      <button
        class="hamburger-button relative lg:hidden z-50 flex flex-col items-center justify-center gap-1.5"
      >
        <span class="ham-btn-span"></span>
        <span class="ham-btn-span"></span>
        <span class="ham-btn-span"></span>
      </button>
    </header>

    <div
      class="container md:max-w-[1400px] h-[2000px] flex flex-col items-center pb-4"
    >
      <!-- 13. Footer -->
      <footer>
        &copy 2026 Created By
        <a
          href="https://github.com/Hary300"
          target="_blank"
          class="text-amber-500 hover:text-amber-200 hover:underline"
          >Hary300</a
        >
